# ExamForge backend — shared settings.
# Secrets come from environment variables or from a git-ignored ".env" file in the backend folder
# (see .env.example). Nothing secret belongs in this file.
spring.application.name=examforge
spring.config.import=optional:file:.env[.properties]
spring.profiles.default=mysql
server.port=${PORT:8080}

# Schema is owned by Flyway (src/main/resources/db/migration). Hibernate only validates it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.type.preferred_instant_jdbc_type=TIMESTAMP
# Load related rows (options, tags, subjects) in batches instead of one query per item
spring.jpa.properties.hibernate.default_batch_fetch_size=50
spring.flyway.enabled=true

# Tokens
app.jwt.secret=${JWT_SECRET}
app.jwt.issuer=examforge
app.jwt.access-token-ttl=15m
app.jwt.refresh-token-ttl=1d
app.jwt.refresh-token-remember-ttl=30d
app.jwt.refresh-reuse-grace=10s

# Auth behaviour
app.auth.require-verified-email=${REQUIRE_VERIFIED_EMAIL:false}
app.auth.cookie-secure=${COOKIE_SECURE:false}
app.auth.cookie-same-site=${COOKIE_SAME_SITE:Strict}
app.auth.max-failed-logins=5
app.auth.lock-duration=15m
app.auth.rate-limit-per-minute=${AUTH_RATE_LIMIT_PER_MINUTE:20}

# Google Sign-In: web client id + optional extra ids for Android/iOS apps (comma-separated)
app.google.web-client-id=${GOOGLE_WEB_CLIENT_ID:}
app.google.extra-client-ids=${GOOGLE_EXTRA_CLIENT_IDS:}

# First administrator (created on startup only if no admin exists yet)
app.admin.email=${ADMIN_EMAIL:}
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD:}
app.admin.full-name=${ADMIN_FULL_NAME:ExamForge Admin}

# Development only: add sample questions and exams when the question bank is empty
app.seed-demo-data=${SEED_DEMO_DATA:false}

# Links in emails point here
app.frontend-url=${APP_FRONTEND_URL:http://localhost:5173}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# Mail. When disabled, emails (verification / reset links) are printed to the log instead.
app.mail.enabled=${MAIL_ENABLED:true}
app.mail.from=${MAIL_FROM}
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
# Gmail / most providers: authenticated SMTP with STARTTLS on port 587
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:true}
spring.mail.properties.mail.smtp.starttls.required=${MAIL_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# Quieten a harmless Hibernate notice about the Instant/TIMESTAMP setting above
logging.level.org.hibernate.orm.incubating=ERROR

# API docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
