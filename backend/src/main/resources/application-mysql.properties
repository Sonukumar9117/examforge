# MySQL profile (default). Activate explicitly with --spring.profiles.active=mysql
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/examforge?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.show-sql=true
